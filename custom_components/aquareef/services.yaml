send_raw_command:
  name: Ham TCP Komutu Gönder
  description: AquaReef LED kontrolcüsüne port 8899 üzerinden doğrudan HEX veya ASCII komut gönderir.
  fields:
    command:
      name: Komut
      description: Gönderilecek komut verisi (örneğin "6D00320032003200320032003200320032003200" veya "oooooooooooooooooooo").
      required: true
      example: "6D00320032003200320032003200320032003200"
      selector:
        text:
    is_hex:
      name: HEX Formatında mı?
      description: Veri HEX formatında gönderilecekse Açık, düz metin/ASCII ise Kapalı seçin.
      default: true
      selector:
        boolean:

set_channels:
  name: Renk Kanallarını Ayarla
  description: AquaReef PRO 4 üzerindeki 9 spektrum kanalının yüzdesini (%0 - %100) ayarlar.
  fields:
    red:
      name: Kırmızı (Red)
      description: Kırmızı LED kanalı (%0 - %100)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    green:
      name: Yeşil / Amber
      description: Yeşil / Amber LED kanalı (%0 - %100)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    royal_blue:
      name: Royal Blue
      description: Royal Blue (Koyu Mavi) LED kanalı (%0 - %100)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    blue:
      name: Mavi (Blue)
      description: Açık Mavi LED kanalı (%0 - %100)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    white:
      name: Beyaz (White)
      description: Soğuk Beyaz LED kanalı (%0 - %100)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    uv:
      name: UV / Mor
      description: UV LED kanalı (%0 - %100)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    mint:
      name: Nane (Mint)
      description: Mint Yeşili LED kanalı (%0 - %100)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    cyan:
      name: Turkuaz (Cyan)
      description: Camgöbeği / Turkuaz LED kanalı (%0 - %100)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    violet:
      name: Menekşe (Violet)
      description: Menekşe / Koyu Mor LED kanalı (%0 - %100)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

apply_preset:
  name: Hazır Mod veya Efekt Uygula
  description: Gün Doğumu, Gün Ortası, Gün Batımı, Ay Işığı, Derin Deniz, Mercan Alıştırma veya Fırtına gibi hazır aydınlatma modlarını uygular.
  fields:
    preset:
      name: Aydınlatma Modu
      description: Seçilecek profil veya efekt
      required: true
      selector:
        select:
          options:
            - "Manuel"
            - "Gün Simülasyonu"
            - "Gün Doğumu (Sunrise)"
            - "Gün Ortası (Midday)"
            - "Gün Batımı (Sunset)"
            - "Ay Işığı / Gece (Moonlight)"
            - "Derin Deniz (Deep Blue)"
            - "Mercan Alıştırma (Acclimation)"
            - "Mercan Fotoğraf Çekim"
            - "Bitkili / Tatlı Su"
            - "Fırtına & Şimşek"
            - "Bulut Efekti"
            - "Tam Güç (%100 Test)"

set_simulation:
  name: 24 Saatlik Gün Simülasyonunu Aç/Kapat
  description: Doğal resif güneş döngüsünü otomatik yönetir.
  fields:
    enabled:
      name: Aktif mi?
      description: Gün simülasyonu açık veya kapalı
      required: true
      selector:
        boolean:

reboot:
  name: AquaReef Cihazını Yeniden Başlat
  description: Wi-Fi modülünü güvenli şekilde yeniden başlatır.
