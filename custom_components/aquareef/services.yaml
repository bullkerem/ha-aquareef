send_raw_command:
  name: Ham TCP Komutu Gönder
  description: AquaReef LED kontrolcüsüne port 8899 üzerinden doğrudan HEX veya ASCII komut gönderir.
  fields:
    command:
      name: Komut
      description: Gönderilecek komut verisi (örneğin "6D00320032003200320032003200320032003200" veya "oooooooooooooooooooo").
      required: true
      example: "6D00320032003200320032003200320032003200"
      selector:
        text:
    is_hex:
      name: HEX Formatında mı?
      description: Veri HEX formatında gönderilecekse Açık, düz metin/ASCII ise Kapalı seçin.
      default: true
      selector:
        boolean:

set_channels:
  name: Renk Kanallarını Ayarla
  description: AquaReef PRO 4 üzerindeki 9 spektrum kanalının yüzdesini (%0 - %100) ayarlar.
  fields:
    red:
      name: Kırmızı (Red)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    green:
      name: Yeşil / Amber
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    royal_blue:
      name: Royal Blue
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    blue:
      name: Mavi (Blue)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    white:
      name: Beyaz (White)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    uv:
      name: UV / Mor
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    mint:
      name: Nane (Mint)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    cyan:
      name: Turkuaz (Cyan)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    violet:
      name: Menekşe (Violet)
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"

apply_preset:
  name: Hazır Mod veya Efekt Uygula
  description: Gün Doğumu, Gün Ortası, Gün Batımı, Ay Işığı, Derin Deniz, Mercan Alıştırma veya Fırtına gibi hazır aydınlatma modlarını uygular.
  fields:
    preset:
      name: Aydınlatma Modu
      required: true
      selector:
        select:
          options:
            - "Manuel"
            - "Gün Simülasyonu"
            - "Manuel Saat Programı"
            - "Gün Doğumu (Sunrise)"
            - "Gün Ortası (Midday)"
            - "Gün Batımı (Sunset)"
            - "Ay Işığı / Gece (Moonlight)"
            - "Derin Deniz (Deep Blue)"
            - "Mercan Alıştırma (Acclimation)"
            - "Mercan Fotoğraf Çekim"
            - "Bitkili / Tatlı Su"
            - "Fırtına & Şimşek"
            - "Bulut Efekti"
            - "Tam Güç (%100 Test)"

set_simulation:
  name: 24 Saatlik Gün Simülasyonunu Aç/Kapat
  description: Doğal resif güneş döngüsünü otomatik yönetir.
  fields:
    enabled:
      name: Aktif mi?
      required: true
      selector:
        boolean:

set_simulation_config:
  name: Gün Simülasyonu Ayarlarını Güncelle
  description: Gün simülasyonu hazır seçeneğini (1-4), açılış/kapanış saatlerini ve geçiş süresini ayarlar.
  fields:
    profile:
      name: Hazır Simülasyon Seçeneği
      selector:
        select:
          options:
            - "1. Karışık Resif (Mixed Reef)"
            - "2. SPS Mercan (Yüksek PAR & UV)"
            - "3. LPS & Soft (Derin Mavi Floresan)"
            - "4. Doğal Gün Işığı (Balık & Bitki)"
    start_time:
      name: Başlangıç (Açılış) Saati
      selector:
        text:
    end_time:
      name: Kapanış (Gün Batımı) Saati
      selector:
        text:
    moon_end_time:
      name: Gece Ay Işığı Bitiş Saati
      selector:
        text:
    ramp_minutes:
      name: Geçiş (Rampa) Süresi (Dk)
      selector:
        number:
          min: 15
          max: 180
          step: 15
    moon_level:
      name: Gece Ay Işığı Seviyesi (%)
      selector:
        number:
          min: 0
          max: 30

set_schedule_slot:
  name: Manuel Saatlik Işık Programı Dilimi Ayarla
  description: Hangi saat aralığında hangi ışığın ve yüzde kaç güçle yanacağını ayarlar.
  fields:
    slot:
      name: Zaman Dilimi (1-4)
      required: true
      selector:
        number:
          min: 1
          max: 4
    time_range:
      name: Saat Aralığı (Örn. 08:00 - 12:00 veya Kapalı)
      selector:
        text:
    light_preset:
      name: Yanan Işık / Spektrum
      selector:
        text:
    intensity:
      name: Parlaklık Yüzdesi (%)
      selector:
        number:
          min: 0
          max: 100

reboot:
  name: AquaReef Cihazını Yeniden Başlat
  description: Wi-Fi modülünü güvenli şekilde yeniden başlatır.
